[project]
name = "mm-agent"
version = "0.1.0"
description = "Agent 七种设计模式的离线可运行示例集：Tool Use / ReAct / Reflection / Planning / Multi-Agent / Sequential / Human-in-the-Loop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mm-agent = "mm_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mm_agent"]
